name: Bootstrap Range Finder

# One-shot bootstrap for the range_finder data + model tables. Use this:
#
#   • After a Postgres wipe.
#   • After a HAR feature-definition change (SCHEMA_VERSION bump).
#
# NOT a recurring job — there is no cron schedule. Trigger manually from
# the GitHub Actions UI. (The 0DTE / daily pipeline and its bootstrap modes
# were removed 2026-07 along with the 0DTE finder.)

on:
  workflow_dispatch:
    inputs:
      weekly_model:
        description: "Weekly model spec to fit and save."
        required: false
        default: "M3_extended"
        type: choice
        options:
          - "M1_baseline"
          - "M2_vix"
          - "M3_extended"
          - "M4_full"
      years:
        description: "Years of weekly history to fetch."
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bootstrap
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Without this the weekly-bar backfill silently falls through to the
          # yfinance fallback (dividend-adjusted ^GSPC) instead of Tradier's
          # unadjusted bars — a subtly different price basis for the HAR
          # training data than production serves. Absent secret still works
          # (fallback), it's just no longer SILENT — bar_sources logs the source.
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          # Pass workflow inputs through the environment, never interpolated
          # directly into the run script — a free-text input spliced into the
          # shell line is a command-injection vector. `weekly_model` is a
          # constrained choice, but `years` is free text, so both go via env
          # and are quoted below.
          WEEKLY_MODEL: ${{ inputs.weekly_model }}
          YEARS: ${{ inputs.years }}
        run: |
          python bootstrap_range_finder.py --model "$WEEKLY_MODEL" --years "$YEARS"
