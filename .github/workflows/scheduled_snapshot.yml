name: Scheduled GEX Snapshot

on:
  # PRIMARY: triggered externally by cron-job.org at 9:28 AM ET (Mon-Fri),
  # two minutes before the bell. The early fire gives the Actions runner
  # time to boot + pip install so Python is already running pre-open work
  # (FRED rate and expirations) during the idle window;
  # scheduled_snapshot.py then parks in its wait loop until 9:30:00 ET
  # before fetching spot + chains. cron-job.org handles DST automatically
  # via America/New_York. Can also be triggered manually from the UI.
  #
  # BACKUP (dead-man's switch): the schedule pair below. GitHub cron is UTC,
  # doesn't shift with DST, and in practice starts these ~4 hours LATE
  # (13:45 UTC fires ~17:45 UTC), so they land after the 9:20-10:15 ET
  # capture window. scheduled_snapshot.py treats a late fire as recovery,
  # not capture: if today's artifacts all exist it exits green; if the
  # week's first-session weekly setup is missing it runs it (the anchor is
  # the daily bar, so late is still correct); if the opening EM snapshots
  # are missing it FAILS, because they can't be reconstructed mid-day —
  # that failure e-mail is the notification when cron-job.org silently dies
  # (expired PAT, account lapse, outage).
  schedule:
    - cron: "45 13 * * 1-5"   # 9:45 ET during EDT (Mar-Nov)
    - cron: "45 14 * * 1-5"   # 9:45 ET during EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      force_weekly_setup:
        description: "Force weekly spread finder rebuild (refit HAR, even on non-Monday). Use after a DB wipe or to refresh after a code change."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    strategy:
      # One ticker's failure must not cancel the others: with the default
      # fail-fast, a JPM schema-lock error cancelled SPX's Monday weekly setup
      # (2026-09-21), so no SPX anchor, fit or calibration plan landed.
      fail-fast: false
      # The forward test captures the same 25 tickers from 9:30 on the same
      # Tradier token. Eight at a time keeps the opening burst at the old
      # 8-ticker matrix's size; later jobs finish well inside the 9:20-10:15
      # window, so a single name's Monday GEX may land a few minutes after 9:30.
      max-parallel: 8
      matrix:
        # The forward-test roster (range_finder/forward_test/config.py
        # UNIVERSE; tests/test_ticker_roster.py keeps the two in sync) plus
        # NDX, an app-only extra: the forward study rejects it (Tradier's NDX
        # quote has zero trade/bid dates), but its live `last` is fine for
        # GEX, EM and the weekly setup. Daily
        # index/ETF captures go first so they land at the open. Single names
        # (stock category; IBIT resolves as one through the dynamic-config
        # path) run weekly-only on the week's first trading day - see the
        # cadence gate in scheduled_snapshot.py. The weekly HAR fit fires
        # Mondays for all, refreshing 6y of bars, so a new ticker builds its
        # own history on its first Monday.
        ticker: [SPX, SPY, QQQ, NDX, IBIT, AAPL, AMD, AMZN, AVGO, BAC, COST, CRWV, CVX, GE,
                 GEV, GOOGL, HOOD, JPM, META, MSFT, MU, NVDA, TSLA, UNH, WMT, XOM]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled snapshot (${{ matrix.ticker }})
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TICKER: ${{ matrix.ticker }}
          FORCE_WEEKLY_SETUP: ${{ inputs.force_weekly_setup || 'false' }}
        run: python scheduled_snapshot.py
